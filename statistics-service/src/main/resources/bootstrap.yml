spring:
  application:
    name: statistics-service
  cloud:
    config:
      uri: ${CONFIG_SERVICE_URI:http://config:8888}
      fail-fast: true
      password: ${CONFIG_SERVICE_PASSWORD}
      username: user

hystrix:
  command:
    # 精准匹配 StatisticsService#getStatistics(String) 接口（核心查询接口）
    StatisticsService#getStatistics(String):
      execution:
        isolation:
          strategy: THREAD  # 线程池隔离（推荐，避免资源竞争）
          thread:
            maxConcurrentRequests: 60  # 最大并发数（核心调整）
            timeoutInMilliseconds: 6000  # 超时时间延长至6秒
            interruptOnTimeout: true  # 超时中断线程（释放资源）
        timeout:
          enabled: true  # 开启超时控制
      circuitBreaker:
        enabled: true  # 开启熔断
        requestVolumeThreshold: 120  # 熔断触发最小请求数
        errorThresholdPercentage: 85  # 错误率阈值
        sleepWindowInMilliseconds: 30000  # 熔断休眠时间
        forceOpen: false  # 不强制熔断
        forceClosed: false  # 不强制关闭熔断
  # Statistics Service 专属线程池配置（避免和其他服务共享线程池）
  threadpool:
    StatisticsService:
      coreSize: 40  # 核心线程数
      maxQueueSize: 30  # 队列大小（-1为无界，建议设固定值）
      queueSizeRejectionThreshold: 25  # 队列拒绝阈值
      keepAliveTimeMinutes: 2  # 线程空闲存活时间
  # 全局兜底配置（非核心接口）
  command:
    default:
      execution:
        isolation:
          thread:
            maxConcurrentRequests: 40
            timeoutInMilliseconds: 4000
      circuitBreaker:
        requestVolumeThreshold: 80
        errorThresholdPercentage: 80
