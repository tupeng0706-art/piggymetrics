spring:
  application:
    name: auth-service
  cloud:
    config:
      uri: ${CONFIG_SERVICE_URI:http://config:8888}
      fail-fast: true
      password: ${CONFIG_SERVICE_PASSWORD:cls@2025}
      username: user

# Hystrix 核心配置（新增/修改）
hystrix:
  command:
    # 精准匹配 AuthServiceClient#createUser(User) 接口（关键：Hystrix 命令名需和接口匹配）
    AuthServiceClient#createUser(User):
      execution:
        isolation:
          strategy: THREAD  # 线程池隔离
          thread:
            maxConcurrentRequests: 50  # 最大并发数（提高阈值）
            timeoutInMilliseconds: 5000  # 超时时间延长至5秒
            interruptOnTimeout: true  # 超时中断线程
        timeout:
          enabled: true  # 开启超时控制
      circuitBreaker:
        enabled: true  # 开启熔断
        requestVolumeThreshold: 10000000  # 熔断触发最小请求数（10秒内≥100才熔断）
        errorThresholdPercentage: 80  # 错误率≥80%才熔断
        sleepWindowInMilliseconds: 30000  # 熔断后30秒尝试恢复
        forceOpen: false  # 不强制熔断
  # Hystrix 线程池配置（全局/精准匹配）
  threadpool:
    AuthServiceClient:  # 对应 createUser 接口的线程池
      coreSize: 50  # 核心线程数（提高至30）
      maxQueueSize: 200  # 队列大小
      queueSizeRejectionThreshold: 200  # 队列拒绝阈值
    default:  # 全局线程池（兜底）
      coreSize: 20
      maxConcurrentRequests: 40